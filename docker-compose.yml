# =====================================================================
#  Весь проект одной командой:
#      docker compose up -d --build        ->  http://localhost:8080
#
#  Только инфраструктура для локальной разработки
#  (API запускается из Visual Studio, фронт — через npm run dev):
#      docker compose up -d redis rabbitmq
#
#  Пароли берутся из файла .env (см. .env.example). Если .env нет —
#  используются значения по умолчанию после ":-" (только для локального запуска!).
# =====================================================================
services:
  postgres:
    image: postgres:17-alpine
    container_name: comments-postgres
    environment:
      POSTGRES_DB: comments_app
      POSTGRES_USER: ${POSTGRES_USER:-comments}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comments_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # при ПЕРВОМ запуске (пустой том) Postgres сам выполнит скрипт создания таблиц
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:5433:5432"          # для DBeaver; 5432 уже занят локальным PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d comments_app"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: comments-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: comments-rabbitmq
    hostname: comments-rabbitmq        # RabbitMQ хранит данные по имени узла; фиксируем, чтобы очереди не терялись
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-comments}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-comments_dev_password}
    ports:
      - "127.0.0.1:5672:5672"          # для API (протокол AMQP)
      - "127.0.0.1:15672:15672"        # веб-панель
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: CommentsApp.Api/Dockerfile
    container_name: comments-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # API стоит за nginx: реальный IP пользователя берём из заголовка X-Forwarded-For
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # Документация API (Scalar) доступна по /scalar — чтобы проверяющий мог "потыкать" API
      Docs__Enabled: "true"
      # Настройки appsettings.json переопределяются переменными окружения ("__" = вложенность)
      ConnectionStrings__DefaultConnection: Host=postgres;Database=comments_app;Username=${POSTGRES_USER:-comments};Password=${POSTGRES_PASSWORD:-comments_dev_password}
      ConnectionStrings__Redis: redis:6379
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${RABBITMQ_USER:-comments}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-comments_dev_password}
    volumes:
      - uploads:/app/Uploads           # загруженные картинки/TXT переживают пересоздание контейнера
    depends_on:                        # API стартует, только когда БД, Redis и RabbitMQ готовы
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: comments-frontend
    ports:
      - "8080:80"                      # сайт: http://localhost:8080
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  uploads:
