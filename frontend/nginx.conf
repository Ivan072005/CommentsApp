# nginx — "администратор на входе": отдаёт готовый фронт,
# а запросы к API, GraphQL, WebSocket и файлам передаёт в контейнер api.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;   # загрузка картинок

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Общие заголовки: API узнаёт реальный IP пользователя и исходный протокол
    # $http_host — вместе с портом (localhost:8080), чтобы Scalar отправлял запросы на правильный адрес
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://api:8080;
    }

    location /graphql {
        proxy_pass http://api:8080;
    }

    location /uploads/ {
        proxy_pass http://api:8080;
    }

    # Документация API: страница Scalar и OpenAPI-описание, по которому она строится
    location /scalar {
        proxy_pass http://api:8080;
    }

    location /openapi/ {
        proxy_pass http://api:8080;
    }

    # SignalR (WebSocket): нужен Upgrade и долгий таймаут
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # JS/CSS с хешем в имени можно кэшировать "навсегда"
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: любые другие пути отдают index.html
    location / {
        try_files $uri /index.html;
    }
}
